name: Update politician and insider trades

on:
  schedule:
    - cron: '15 12 * * *'      # daily, 08:15 Toronto
  workflow_dispatch:
    inputs:
      debug:
        description: 'Print parser debug output'
        type: boolean
        default: false
      max:
        description: 'Max new filings per chamber this run'
        default: '400'
      reprocess:
        description: 'Re-read every House and President filing with the current parsers'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'QWERTx admin@qwertx.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF text and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-pil python3-numpy >/dev/null
      - name: Congressional trades (House + Senate)
        run: node scripts/fetch-congress.mjs --max ${{ inputs.max || '400' }} ${{ inputs.debug && '--debug' || '' }} ${{ inputs.reprocess && '--reparse-house' || '' }}
      - name: Insider trades (SEC Form 4 quarterly data)
        run: node scripts/fetch-insiders.mjs
      - name: President Trump (OGE periodic transaction and annual reports)
        run: node scripts/fetch-trump.mjs ${{ inputs.reprocess && '--force' || '' }}
        continue-on-error: true
      - name: Featured members of Congress (full holdings and trades)
        run: node scripts/fetch-featured.mjs ${{ inputs.reprocess && '--force' || '' }}
        continue-on-error: true
      - name: Commit updated data
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: politician and insider trades $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
