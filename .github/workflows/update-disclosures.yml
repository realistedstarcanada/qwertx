name: Update politician and insider trades

on:
  schedule:
    - cron: '15 12 * * *'      # daily, 08:15 Toronto
  workflow_dispatch:
    inputs:
      debug:
        description: 'Print parser debug output'
        type: boolean
        default: false
      max:
        description: 'Max new filings per chamber this run'
        default: '400'
      trump_only:
        description: 'Re-read only these Trump reports (comma-separated parts of file names)'
        default: ''
      reprocess:
        description: 'Re-read every House and President filing with the current parsers'
        type: boolean
        default: false
      reparse_house:
        description: 'Re-read every House filing only (quick)'
        type: boolean
        default: false

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    env:
      SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'QWERTx admin@qwertx.com' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install PDF text and OCR tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-pil python3-numpy >/dev/null
      - name: Congressional trades (House + Senate)
        run: node scripts/fetch-congress.mjs --max ${{ inputs.max || '400' }} ${{ inputs.debug && '--debug' || '' }} ${{ (inputs.reprocess || inputs.reparse_house) && '--reparse-house' || '' }}
      - name: Insider trades (SEC Form 4 quarterly data)
        run: node scripts/fetch-insiders.mjs
      - name: President Trump (OGE periodic transaction and annual reports)
        run: node scripts/fetch-trump.mjs ${{ inputs.debug && '--debug' || '' }} ${{ inputs.reprocess && '--force' || '' }} ${{ inputs.trump_only && format('--only "{0}"', inputs.trump_only) || '' }}
        continue-on-error: true
      - name: Featured members of Congress (full holdings and trades)
        run: node scripts/fetch-featured.mjs ${{ inputs.reprocess && '--force' || '' }}
        continue-on-error: true
      - name: Build site data (needed for the 8-K ticker list)
        run: node build.mjs
      - name: Company events (SEC 8-K)
        run: node scripts/fetch-8k.mjs
        continue-on-error: true
      - name: Economic data for Market Weather (FRED, Bank of Canada, Statistics Canada)
        run: node scripts/fetch-macro.mjs
        continue-on-error: true
        env:
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
      - name: Licensed prices and analyst data (does nothing until switched on in config/pro.json)
        run: node scripts/fetch-fmp.mjs
        continue-on-error: true
        env:
          FMP_API_KEY: ${{ secrets.FMP_API_KEY }}
          PRO_SITE_URL: ${{ secrets.PRO_SITE_URL }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Commit updated data
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: politician and insider trades $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
