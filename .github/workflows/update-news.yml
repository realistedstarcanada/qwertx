name: Update news and market mood

on:
  schedule:
    - cron: '0 11 * * *'   # daily, 07:00 Toronto (EDT). Add more lines for extra refreshes.
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Fetch headlines and Fear & Greed snapshot
        run: node scripts/fetch-news.mjs
      - name: Commit updated data
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: news $(date -u +%F)"
          git pull --rebase
          git push
