name: Update news and markets

on:
  schedule:
    - cron: '0 11 * * *'       # daily, 07:00 Toronto (EDT)
    - cron: '50 12 * * 1-5'    # weekdays after the 8:30 ET data releases, 08:50 Toronto
    - cron: '30 21 * * 1-5'    # weekdays after the US close, 17:30 Toronto
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Headlines
        run: node scripts/fetch-news.mjs
      - name: VIX, indexes, yields, oil, gold, Fear & Greed
        run: node scripts/fetch-market.mjs
      - name: Economic calendar and earnings dates
        run: node scripts/fetch-calendar.mjs
      - name: Commit updated data
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: news, markets and calendar $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
