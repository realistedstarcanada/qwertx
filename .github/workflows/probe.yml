name: Probe (temporary)
on:
  push:
    branches: [probe]
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils tesseract-ocr python3-pil python3-numpy >/dev/null
      - run: |
          mkdir -p data/_debug
          for f in "4.20.2026" "05.08.2026-278T.pdf" "12.18.2025" "08.12.2026"; do node scripts/fetch-trump.mjs --debug --only "$f" > /dev/null 2>&1 || true; done
          UA="Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36"
          for d in 20035035 20034906 20035390 20035408; do curl -sSL -A "$UA" -o /tmp/$d.pdf "https://disclosures-clerk.house.gov/public_disc/ptr-pdfs/2026/$d.pdf" && pdftotext -raw /tmp/$d.pdf data/_debug/house-$d.txt; done
          ls -la data/_debug | head -40
      - run: |
          git config user.name qwertx-bot && git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A -f data/_debug && git commit -m "probe output" && git push -f origin HEAD:probe
