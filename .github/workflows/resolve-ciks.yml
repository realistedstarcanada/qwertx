name: Find SEC IDs for new investors

# Looks up each manager in config/investor-candidates.json on SEC EDGAR and saves the matches to
# data/cik-candidates.json for review. Runs when that list changes on the testing branch, or by hand.
on:
  push:
    branches: [pro-phase1]
    paths: ['config/investor-candidates.json', 'scripts/resolve-ciks.mjs', '.github/workflows/resolve-ciks.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node scripts/resolve-ciks.mjs
        env:
          SEC_USER_AGENT: ${{ secrets.SEC_USER_AGENT || 'QWERTx admin@qwertx.com' }}
      - name: Commit results
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/cik-candidates.json
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: SEC IDs for candidate investors $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
