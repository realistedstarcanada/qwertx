name: Update prices and analyst targets

# Prices, analyst price targets, buy/hold/sell counts and earnings history for the Pro page.
# While the site is internal-only this uses Yahoo Finance (scripts/fetch-yahoo.mjs); switch config/pro.json
# "vendor" to the licensed feed before public launch. Weekdays after the US close, or run it by hand.
on:
  schedule:
    - cron: '30 22 * * 1-5'   # 18:30 Toronto (EDT), after the close
  push:
    # Runs on the testing branch whenever the price script or this file changes (scheduled runs need main).
    branches: [pro-phase1]
    paths: ['scripts/fetch-yahoo.mjs', '.github/workflows/update-prices.yml']
  workflow_dispatch:
    inputs:
      tickers:
        description: 'Extra tickers to include, space-separated (optional)'
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Build (to know which stocks fund managers own)
        run: node build.mjs > /dev/null
      - name: Prices, analyst targets and earnings history
        run: node scripts/fetch-yahoo.mjs
        env:
          TICKERS: ${{ github.event.inputs.tickers || '' }}
          PRO_SITE_URL: ${{ github.ref_name == 'main' && secrets.PRO_SITE_URL || format('https://{0}.qwertx.pages.dev', github.ref_name) }}
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
      - name: Commit updated data
        run: |
          git config user.name "qwertx-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/vendor
          if git diff --staged --quiet; then echo "No changes"; exit 0; fi
          git commit -m "data: prices and analyst targets $(date -u +%F)"
          for i in 1 2 3; do git pull --rebase -X theirs && git push && break; sleep 5; done
